<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강의 Q&amp;A</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --user: #2f5bd3; --user-text: #fff;
    --ok: #1f8a4c; --warn: #b7791f; --err: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c323d;
      --accent: #7b9cf0; --accent-soft: #232c42; --user: #3a5bc0; --user-text: #fff;
      --ok: #4cc784; --warn: #e0b04f; --err: #f07171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  #me { font-size: 13px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 14px; margin: 0 0 10px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px 12px; text-align: center;
          font-size: 13px; color: var(--muted); cursor: pointer; transition: .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  #drop small { display: block; margin-top: 6px; font-size: 11px; }
  #docs { list-style: none; padding: 0; margin: 16px 0 0; }
  #docs li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  #docs li .info { flex: 1; min-width: 0; }
  #docs li .name { word-break: break-all; }
  #docs li .st { font-size: 11px; color: var(--muted); }
  #docs li .st.ready { color: var(--ok); } #docs li .st.processing { color: var(--warn); } #docs li .st.failed { color: var(--err); }
  #docs li button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; }
  #docs li button:hover { color: var(--err); }
  #docs .empty { color: var(--muted); font-size: 13px; border: 0; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 780px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); padding: 8px 14px; border-radius: 14px 14px 2px 14px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; border-radius: 14px 14px 14px 2px; }
  .msg.bot.pending { color: var(--muted); }
  .msg.bot.error { color: var(--err); }
  .msg code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .cite { color: var(--accent); font-size: .75em; margin-left: 1px; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: normal; }
  .sources details { margin: 3px 0; }
  .sources summary { cursor: pointer; }
  .sources p { margin: 4px 0 6px 14px; white-space: pre-wrap; }
  .intro { color: var(--muted); font-size: 14px; text-align: center; margin: auto; max-width: 420px; line-height: 1.7; }
  form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
             background: var(--bg); color: var(--text); max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 38vh; }
    header, form { padding-left: 16px; padding-right: 16px; } #log { padding: 16px; }
  }
</style>
</head>
<body>
<header><h1>강의 Q&amp;A 챗봇</h1><span id="me"></span></header>
<main>
  <aside>
    <h2>내 강의자료</h2>
    <div id="drop" tabindex="0">파일을 끌어다 놓거나 눌러서 선택
      <small>PDF · PPTX · DOCX · HWPX · MD · TXT (최대 30MB)</small></div>
    <input id="file" type="file" multiple hidden accept=".pdf,.pptx,.docx,.hwpx,.md,.markdown,.txt">
    <ul id="docs"></ul>
  </aside>
  <section class="chat">
    <div id="log"><p class="intro">강의자료를 올린 뒤 궁금한 점을 물어보세요.<br>답변은 올린 자료만 근거로 하며, 출처를 함께 보여 줍니다.</p></div>
    <form id="ask">
      <textarea id="q" rows="1" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send">질문</button>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const turns = [];
let pollTimer = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) throw new Error((body && body.detail && (typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail))) || `오류 ${r.status}`);
  return body;
}

// ---- 문서 목록 ----
const STATUS = { processing: '처리 중…', ready: '완료', failed: '실패' };
async function loadDocs() {
  let docs;
  try { docs = await api('/api/documents'); } catch (e) { $('#docs').replaceChildren(el('li', 'empty', e.message)); return; }
  const ul = $('#docs');
  ul.replaceChildren();
  if (!docs.length) ul.append(el('li', 'empty', '아직 올린 자료가 없습니다.'));
  for (const d of docs) {
    const li = el('li');
    const info = el('div', 'info');
    info.append(el('div', 'name', d.filename));
    const st = d.status === 'ready' ? `완료 · ${d.chunks}개 조각` : d.status === 'failed' ? `실패: ${d.error || ''}` : STATUS[d.status];
    info.append(el('div', 'st ' + d.status, st));
    const del = el('button', null, '✕');
    del.title = '삭제';
    del.onclick = async () => {
      if (!confirm(`"${d.filename}"을(를) 삭제할까요?`)) return;
      try { await api(`/api/documents/${d.id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); }
      loadDocs();
    };
    li.append(info, del);
    ul.append(li);
  }
  clearTimeout(pollTimer);
  if (docs.some(d => d.status === 'processing')) pollTimer = setTimeout(loadDocs, 2000);
}

async function uploadFiles(files) {
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    try { await api('/api/upload', { method: 'POST', body: fd }); }
    catch (e) { alert(`${f.name}: ${e.message}`); }
    loadDocs();
  }
}

const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); };
fileInput.onchange = () => { uploadFiles([...fileInput.files]); fileInput.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); };

// ---- 채팅 ----
const log = $('#log'), q = $('#q'), send = $('#send');
function addMsg(cls, text) {
  log.querySelector('.intro')?.remove();
  const m = el('div', 'msg ' + cls, text);
  log.append(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

// 최소한의 마크다운: HTML을 먼저 이스케이프한 뒤 굵게, 코드, 인용 번호만 꾸민다.
function md(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,6}\s+(.+)$/gm, '<strong>$1</strong>')
    .replace(/\[(\d+)\]/g, '<sup class="cite">[$1]</sup>');
}

function renderSources(m, sources) {
  if (!sources || !sources.length) return;
  const box = el('div', 'sources');
  box.append(el('div', null, '출처'));
  for (const s of sources) {
    const d = el('details');
    d.append(el('summary', null, `[${s.n}] ${s.filename}${s.location ? ' · ' + s.location : ''}`));
    d.append(el('p', null, s.snippet + (s.snippet.length >= 300 ? '…' : '')));
    box.append(d);
  }
  m.append(box);
}

$('#ask').onsubmit = async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question || send.disabled) return;
  q.value = ''; q.style.height = '';
  addMsg('user', question);
  const m = addMsg('bot pending', '자료에서 찾는 중…');
  send.disabled = true;
  try {
    const j = await api('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ question, history: turns.slice(-8) }) });
    m.className = 'msg bot';
    m.innerHTML = md(j.answer);
    renderSources(m, j.sources);
    turns.push({ role: 'user', content: question }, { role: 'assistant', content: j.answer });
  } catch (err) {
    m.className = 'msg bot error';
    m.textContent = err.message;
  } finally {
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    q.focus();
  }
};
q.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#ask').requestSubmit(); } };
q.oninput = () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; };

api('/api/me').then(j => $('#me').textContent = j.email).catch(() => {});
loadDocs();
</script>
</body>
</html>
